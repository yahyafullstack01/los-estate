<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d2b2e" />
    <title>Offline — LOS ESTATE</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: system-ui, -apple-system, sans-serif;
        background: #071416;
        color: #f0ebe0;
      }
      .card {
        max-width: 28rem;
        width: 100%;
        text-align: center;
        border: 1px solid #1e4549;
        background: #0d2b2e;
        border-radius: 1rem;
        padding: 2rem 1.5rem;
      }
      img {
        width: 7rem;
        height: auto;
        margin: 0 auto 1.25rem;
        display: block;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
        font-weight: 600;
        color: #c5a059;
      }
      p {
        margin: 0 0 1.5rem;
        line-height: 1.55;
        color: #9aab9e;
        font-size: 0.95rem;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 0.5rem;
        background: #c5a059;
        color: #0d2b2e;
        font-weight: 600;
        font-size: 0.95rem;
        padding: 0.75rem 1.25rem;
        cursor: pointer;
      }
      button:hover {
        background: #d4b876;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/logo-dark.png" alt="LOS ESTATE" width="140" height="48" />
      <h1>You’re offline</h1>
      <p>
        No internet connection right now. Check your network, then try again to
        browse LOS ESTATE properties.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
